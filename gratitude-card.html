<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감사 대화카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink-950:#0A1120;
    --ink-900:#111A2E;
    --ink-850:#16223A;
    --ink-800:#1D2C48;
    --paper:#F1E7C9;
    --paper-dim:#B7AD8C;
    --gold:#D9B94A;
    --gold-soft:#8C7A3E;
    --line: rgba(241,231,201,0.14);
    --line-strong: rgba(241,231,201,0.28);
    --tier-surface:#C9A227;
    --tier-daily:#B5651D;
    --tier-being:#7A2E2E;
    --tier-color: var(--gold);
    --tier-rgb: 217,185,74;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-950);
    color:var(--paper);
    font-family:"Noto Sans KR", system-ui, sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--gold);}
  a:hover{color:#EAD27A;}
  .serif{font-family:"Noto Serif KR", serif;}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px;}

  .stars{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(217,185,74,0.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 82% 18%, rgba(241,231,201,0.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 40%, rgba(217,185,74,0.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 62%, rgba(241,231,201,0.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 90% 68%, rgba(217,185,74,0.4) 50%, transparent 51%);
    opacity:0.85;pointer-events:none;
  }

  header.hero{position:relative;padding:40px 0 28px;overflow:hidden;border-bottom:1px solid var(--line);}
  .hero-inner{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .eyebrow{font-size:11.5px;letter-spacing:0.28em;color:var(--gold-soft);text-transform:uppercase;}
  .card-no{font-size:12.5px;color:var(--paper-dim);}

  main{padding:28px 0 56px;}

  .tier-badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 14px;border-radius:100px;
    background:rgba(var(--tier-rgb), 0.18);
    border:1px solid rgba(var(--tier-rgb), 0.55);
    color:var(--paper);font-size:13px;letter-spacing:0.02em;
    margin-bottom:18px;
  }
  .tier-dot{width:8px;height:8px;border-radius:50%;background:var(--tier-color);flex:none;}

  .tier-title{font-size:12.5px;color:var(--gold-soft);letter-spacing:0.04em;margin-bottom:6px;}

  .question{
    font-size:clamp(21px,5.2vw,26px);
    color:var(--paper);
    margin:0 0 28px;
    font-weight:600;
    text-wrap:balance;
  }

  .verse-box{
    background:linear-gradient(180deg, var(--ink-900), var(--ink-850));
    border:1px solid var(--line);
    border-left:3px solid var(--tier-color);
    border-radius:14px;
    padding:22px 22px 20px;
    margin-bottom:22px;
  }
  .verse-ref{
    font-size:12px;letter-spacing:0.06em;color:var(--gold);
    margin-bottom:10px;font-weight:600;
  }
  .verse-text{
    font-size:16.5px;color:var(--paper);line-height:1.8;
  }
  .verse-version{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--paper-dim);
  }

  .connect-box{
    padding:0 2px;
    margin-bottom:34px;
  }
  .connect-kicker{
    font-size:12px;letter-spacing:0.04em;color:var(--gold-soft);margin-bottom:8px;
  }
  .connect-text{
    font-size:14.5px;color:var(--paper-dim);line-height:1.8;
  }

  .divider{height:1px;background:var(--line);margin:30px 0;}

  .prompt-again{
    text-align:center;font-size:13px;color:var(--paper-dim);
    background:var(--ink-900);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:8px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:24px 0 40px;text-align:center;color:var(--paper-dim);font-size:11.5px;
  }
  footer .links{margin-bottom:8px;font-size:13px;}
  footer .credit{opacity:0.8;}

  .notfound{
    text-align:center;padding:80px 0;
  }
  .notfound h1{font-size:20px;margin-bottom:12px;color:var(--paper);}
  .notfound p{color:var(--paper-dim);font-size:14px;margin-bottom:20px;}
  .btn{
    display:inline-block;border:1px solid var(--gold);color:var(--gold);
    padding:9px 20px;border-radius:100px;font-size:13px;text-decoration:none;
  }
  .btn:hover{background:var(--gold);color:var(--ink-950);}
</style>
</head>
<body>

<header class="hero">
  <div class="stars" aria-hidden="true"></div>
  <div class="wrap hero-inner">
    <div class="eyebrow">감사 대화카드</div>
    <div class="card-no" id="cardNo"></div>
  </div>
</header>

<main class="wrap" id="mainContent"></main>

<footer>
  <div class="links"><a href="gratitude.html">감사 저니 전체 보기 →</a></div>

</footer>

  var TIER_COLOR = { surface: "#C9A227", daily: "#B5651D", being: "#7A2E2E" };
  var TIER_RGB   = { surface: "201,162,39", daily: "181,101,29", being: "122,46,46" };

  function getCardId() {
    // #7 (해시) 와 ?id=7 (쿼리스트링) 둘 다 지원합니다.
    var h = (window.location.hash || "").replace(/^#/, "");
    if (h) return h;
    var m = /[?&]id=([^&]*)/.exec(window.location.search || "");
    return m ? decodeURIComponent(m[1]) : "";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    var id = parseInt(getCardId(), 10);
    var mainEl = document.getElementById("mainContent");
    var cardNoEl = document.getElementById("cardNo");
    var card = CARD_DATA[id];

    if (!card) {
      cardNoEl.textContent = "";
      mainEl.innerHTML =
        '<div class="notfound">' +
          '<h1 class="serif">카드를 찾을 수 없어요</h1>' +
          '<p>카드 번호가 없거나 잘못된 링크예요. 카드 뒷면의 QR을 다시 스캔해보세요.</p>' +
          '<a class="btn" href="gratitude.html">감사 저니로 돌아가기</a>' +
        '</div>';
      return;
    }

    document.documentElement.style.setProperty("--tier-color", TIER_COLOR[card.tier]);
    document.documentElement.style.setProperty("--tier-rgb", TIER_RGB[card.tier]);
    cardNoEl.textContent = (id < 10 ? "0" + id : id) + " / 30";

    mainEl.innerHTML =
      '<div class="tier-badge"><span class="tier-dot"></span>' + escapeHtml(card.tierLabel) + '</div>' +
      '<div class="question serif">' + escapeHtml(card.question) + '</div>' +
      '<div class="verse-box">' +
        '<div class="verse-ref">' + escapeHtml(card.verseRef) + '</div>' +
        '<div class="verse-text serif">' + escapeHtml(card.verseText) + '</div>' +
        '<div class="verse-version">성경전서 새번역 © 대한성서공회 2001</div>' +
      '</div>' +
      '<div class="connect-box">' +
        '<div class="connect-kicker">이 말씀과 이 질문, 왜 연결될까요</div>' +
        '<div class="connect-text">' + escapeHtml(card.connect) + '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="prompt-again">카드에 적힌 질문에, 이 말씀을 생각하며 한 번 더 답해보세요.</div>';
  }

  render();
  window.addEventListener("hashchange", render);
