<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감사 대화카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F8F1E0;
    --panel:#FFFCF4;
    --panel-alt:#FBF2DE;
    --ink:#4A2E1E;
    --ink-dim:#9B8664;
    --gold:#C9A227;
    --gold-deep:#A3791C;
    --terracotta:#B5651D;
    --maroon:#7A2E2E;
    --line: rgba(74,46,30,0.12);
    --line-strong: rgba(74,46,30,0.24);
    --tier-surface:#C9A227;
    --tier-daily:#B5651D;
    --tier-being:#7A2E2E;
    --tier-color: var(--gold);
    --tier-rgb: 201,162,39;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR", system-ui, sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--gold-deep);}
  a:hover{color:var(--terracotta);}
  .serif{font-family:"Noto Serif KR", serif;}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px;}

  .stars{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(201,162,39,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 82% 18%, rgba(181,101,29,0.28) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 40%, rgba(201,162,39,0.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 62%, rgba(181,101,29,0.25) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 90% 68%, rgba(201,162,39,0.32) 50%, transparent 51%);
    opacity:0.85;pointer-events:none;
  }

  header.hero{position:relative;padding:40px 0 28px;overflow:hidden;border-bottom:1px solid var(--line);}
  .hero-inner{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .eyebrow{font-size:11.5px;letter-spacing:0.28em;color:var(--gold-deep);text-transform:uppercase;}
  .card-no{font-size:12.5px;color:var(--ink-dim);}

  main{padding:28px 0 56px;}

  .tier-badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 14px;border-radius:100px;
    background:rgba(var(--tier-rgb), 0.16);
    border:1px solid rgba(var(--tier-rgb), 0.5);
    color:var(--ink);font-size:13px;letter-spacing:0.02em;
    margin-bottom:18px;
  }
  .tier-dot{width:8px;height:8px;border-radius:50%;background:var(--tier-color);flex:none;}

  .tier-title{font-size:12.5px;color:var(--gold-deep);letter-spacing:0.04em;margin-bottom:6px;}

  .question{
    font-size:clamp(21px,5.2vw,26px);
    color:var(--ink);
    margin:0 0 28px;
    font-weight:600;
    text-wrap:balance;
  }

  .verse-box{
    background:linear-gradient(180deg, var(--panel), var(--panel-alt));
    border:1px solid var(--line);
    border-left:3px solid var(--tier-color);
    border-radius:14px;
    padding:22px 22px 20px;
    margin-bottom:22px;
    box-shadow:0 2px 14px rgba(74,46,30,0.06);
  }
  .verse-ref{
    font-size:12px;letter-spacing:0.06em;color:var(--gold-deep);
    margin-bottom:10px;font-weight:600;
  }
  .verse-text{
    font-size:16.5px;color:var(--ink);line-height:1.8;
  }
  .verse-version{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-dim);
  }

  .background-box{
    padding:0 2px;
    margin-bottom:22px;
  }
  .background-kicker{
    font-size:12px;letter-spacing:0.04em;color:var(--gold-deep);margin-bottom:8px;
  }
  .background-text{
    font-size:14.5px;color:var(--ink-dim);line-height:1.8;
  }

  .connect-box{
    padding:0 2px;
    margin-bottom:34px;
  }
  .connect-kicker{
    font-size:12px;letter-spacing:0.04em;color:var(--gold-deep);margin-bottom:8px;font-weight:600;
  }
  .connect-text{
    font-size:14.5px;color:var(--ink);line-height:1.8;
  }

  .divider{height:1px;background:var(--line);margin:30px 0;}

  .prompt-again{
    text-align:center;font-size:13px;color:var(--ink-dim);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:8px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:24px 0 40px;text-align:center;color:var(--ink-dim);font-size:11.5px;
  }
  footer .links{margin-bottom:8px;font-size:13px;}
  footer .credit{opacity:0.8;}

  .notfound{
    text-align:center;padding:80px 0;
  }
  .notfound h1{font-size:20px;margin-bottom:12px;color:var(--ink);}
  .notfound p{color:var(--ink-dim);font-size:14px;margin-bottom:20px;}
  .btn{
    display:inline-block;border:1px solid var(--gold-deep);color:var(--gold-deep);
    padding:9px 20px;border-radius:100px;font-size:13px;text-decoration:none;
  }
  .btn:hover{background:var(--gold-deep);color:var(--panel);}
</style>
</head>
<body>

<header class="hero">
  <div class="stars" aria-hidden="true"></div>
  <div class="wrap hero-inner">
    <div class="eyebrow">감사 대화카드</div>
    <div class="card-no" id="cardNo"></div>
  </div>
</header>

<main class="wrap" id="mainContent"></main>

<footer>
  <div class="links"><a href="gratitude.html">감사 저니 전체 보기 →</a></div>
  <div class="credit">말씀: 성경전서 새번역 © 대한성서공회 2001 · 기독교교육리더십연구소</div>
</footer>

      connect: "자족을 배웠다는 바울의 그 고백처럼, 포기하고 싶었던 그 순간을 버티게 한 힘도 사실 내 것이 아니었을 거예요."
    },

    30: {
      tier: "being",
      tierLabel: "존재 · 신앙의 핵심",
      question: "지금의 신앙이 처음과 달라졌다면, 무엇이 그렇게 만들었나요?",
      verseRef: "빌립보서 1:6",
      verseText: "선한 일을 여러분 가운데서 시작하신 분께서 그리스도 예수의 날까지 그 일을 완성하시리라고, 나는 확신합니다.",
      background: "빌립보서 서두에서, 바울은 빌립보 교회 안에서 시작된 믿음의 여정을 떠올리며 “시작하신 분이 끝까지 이루신다”는 확신을 적어요.",
      connect: "시작하신 분이 끝까지 이루신다는 그 확신처럼, 처음과 달라진 지금의 신앙도 그 약속이 지금도 진행 중이라는 증거예요."
    }

  };

  var TIER_COLOR = { surface: "#C9A227", daily: "#B5651D", being: "#7A2E2E" };
  var TIER_RGB   = { surface: "201,162,39", daily: "181,101,29", being: "122,46,46" };

  function getCardId() {
    // #7 (해시) 와 ?id=7 (쿼리스트링) 둘 다 지원합니다.
    var h = (window.location.hash || "").replace(/^#/, "");
    if (h) return h;
    var m = /[?&]id=([^&]*)/.exec(window.location.search || "");
    return m ? decodeURIComponent(m[1]) : "";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    var id = parseInt(getCardId(), 10);
    var mainEl = document.getElementById("mainContent");
    var cardNoEl = document.getElementById("cardNo");
    var card = CARD_DATA[id];

    if (!card) {
      cardNoEl.textContent = "";
      mainEl.innerHTML =
        '<div class="notfound">' +
          '<h1 class="serif">카드를 찾을 수 없어요</h1>' +
          '<p>카드 번호가 없거나 잘못된 링크예요. 카드 뒷면의 QR을 다시 스캔해보세요.</p>' +
          '<a class="btn" href="gratitude.html">감사 저니로 돌아가기</a>' +
        '</div>';
      return;
    }

    document.documentElement.style.setProperty("--tier-color", TIER_COLOR[card.tier]);
    document.documentElement.style.setProperty("--tier-rgb", TIER_RGB[card.tier]);
    cardNoEl.textContent = (id < 10 ? "0" + id : id) + " / 30";

    mainEl.innerHTML =
      '<div class="tier-badge"><span class="tier-dot"></span>' + escapeHtml(card.tierLabel) + '</div>' +
      '<div class="question serif">' + escapeHtml(card.question) + '</div>' +
      '<div class="verse-box">' +
        '<div class="verse-ref">' + escapeHtml(card.verseRef) + '</div>' +
        '<div class="verse-text serif">' + escapeHtml(card.verseText) + '</div>' +
        '<div class="verse-version">성경전서 새번역 © 대한성서공회 2001</div>' +
      '</div>' +
      '<div class="background-box">' +
        '<div class="background-kicker">이 말씀, 이렇게 쓰였어요</div>' +
        '<div class="background-text">' + escapeHtml(card.background) + '</div>' +
      '</div>' +
      '<div class="connect-box">' +
        '<div class="connect-kicker">삶으로 가져오면</div>' +
        '<div class="connect-text">' + escapeHtml(card.connect) + '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="prompt-again">카드에 적힌 질문에, 이 말씀을 생각하며 한 번 더 답해보세요.</div>';
  }

  render();
  window.addEventListener("hashchange", render);
</script>

</body>
</html>
